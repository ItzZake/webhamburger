<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <link rel="stylesheet" href="Cart.css" />
    <script src="data.js"></script>
  </head>
  <body>
    <div class="cart-wrapper">
      <div class="blobs">
        <div class="blob-dodge"><div class="blob a"></div></div>
        <div class="blob-dodge"><div class="blob b"></div></div>
        <div class="blob-dodge"><div class="blob c"></div></div>
      </div>

      <div class="cart-card">
        <div class="cart-pane">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 18px;
            "
          >
            <h2 style="margin: 0; color: #e3e3ff">Shopping Cart</h2>
            <div id="item-count" style="color: var(--muted)"></div>
          </div>

          <div id="cart-items"></div>

          <div class="back-to-shop">
            <a href="../../Store/Store/Store.php" style="color: #d9caff">← Back to shop</a>
          </div>
        </div>

        <div class="summary-pane">
          <h3 style="margin-top: 0; color: #e3e3ff">Summary</h3>
          <div
            style="
              margin: 18px 0;
              border-top: 1px solid rgba(255, 255, 255, 0.04);
              padding-top: 18px;
            "
          >
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 8px;
              "
            >
              <div>Items</div>
              <div id="summary-items">0</div>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 8px;
              "
            >
              <div>Subtotal</div>
              <div id="summary-sub">$0.00</div>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 8px;
              "
            >
              <div>Shipping</div>
              <div id="summary-ship">$5.00</div>
            </div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 14px;
                font-weight: 700;
              "
            >
              <div>Total</div>
              <div id="summary-total">$0.00</div>
            </div>
          </div>
          <button
            id="checkout"
            class="card-btn"
            style="width: 140%; margin-top: 16px"
            onclick="handleCheckoutClick(event)"
          >
            CHECKOUT
          </button>
        </div>
      </div>
    </div>

    <script>
      // Utility to parse price like "$25" -> 25
      function parsePrice(str) {
        if (!str) return 0;
        return Number(String(str).replace(/[^0-9.-]+/g, "")) || 0;
      }

      async function renderCart() {
        const itemsRoot = document.getElementById("cart-items");
        itemsRoot.innerHTML = "<div style='text-align:center; padding:20px; color:var(--muted);'>Loading cart...</div>";

        let cart = [];
        let serverCartId = localStorage.getItem("server_cart_id");
        const user_id = window.user_id || null;

        // Try to load from database if user is logged in
        if (user_id) {
          try {
            const url = serverCartId 
              ? `../../api/cart/get.php?cart_id=${serverCartId}`
              : `../../api/cart/get.php?member_id=${user_id}`;
            
            const response = await fetch(url);
            if (response.ok) {
              const result = await response.json();
              if (result.items && Array.isArray(result.items)) {
                // Convert database items to cart format
                result.items.forEach(item => {
                  cart.push({
                    id: item.product.id,
                    name: item.product.name,
                    desc: '',
                    price: `$${item.unit_price.toFixed(2)}`,
                    img: item.product.img || '../../Store/Store/Images/product1.png',
                    type: 'product',
                    qty: item.quantity,
                    cart_item_id: item.cart_item_id
                  });
                });
                
                if (result.cart_id) {
                  localStorage.setItem("server_cart_id", result.cart_id);
                }
              }
            }
          } catch (error) {
            console.warn("Failed to load server cart:", error);
          }
        }

        // Merge with localStorage cart (for memberships and offline items)
        const localCart = JSON.parse(localStorage.getItem("cart") || "[]");
        const memberships = localCart.filter(item => item.type === 'membership');
        cart = cart.concat(memberships);

        const grouped = {};
        cart.forEach((p) => {
          const key = p.id || p.cart_item_id;
          if (!grouped[key]) {
            grouped[key] = Object.assign({}, p, { qty: p.qty || 1 });
          } else {
            grouped[key].qty = (grouped[key].qty || 1) + (p.qty || 1);
          }
        });

        const entries = Object.values(grouped);
        itemsRoot.innerHTML = "";

        let subtotal = 0;
        let totalCount = 0;

        entries.forEach((item) => {
          totalCount += item.qty;
          const price = parsePrice(item.price);
          subtotal += price * item.qty;

          const el = document.createElement("div");
          el.className = "cart-item";
          const isMembership = item.type === 'membership';
          el.innerHTML = `
                        <img src="${item.img || '../../Store/Store/Images/product1.png'}" alt="${item.name}" />
                        <div class="meta">
                            <h4>${item.name}</h4>
                            <p>${item.desc || ''}</p>
                            ${isMembership ? '<span style="color: var(--accent-secondary); font-size: 12px;">Membership</span>' : ''}
                        </div>
                        <div class="qty">
                            ${!isMembership ? `
                            <button data-id="${item.id}" data-op="dec">-</button>
                            <div style="min-width:24px; text-align:center">${item.qty}</div>
                            <button data-id="${item.id}" data-op="inc">+</button>
                            ` : `<div style="min-width:24px; text-align:center; color: var(--muted);">1</div>`}
                        </div>
                        <div style="width:90px; text-align:right;">
                            <div class="price">${item.price}</div>
                            <div><button data-id="${item.id}" data-op="rm" style="background:transparent;border:none;color:var(--muted);cursor:pointer">Remove</button></div>
                        </div>
                    `;

          itemsRoot.appendChild(el);
        });

        document.getElementById("item-count").textContent =
          totalCount + (totalCount === 1 ? " item" : " items");
        document.getElementById("summary-items").textContent = totalCount;
        document.getElementById("summary-sub").textContent =
          "$" + subtotal.toFixed(2);
        const ship = totalCount > 0 ? 5 : 0;
        document.getElementById("summary-ship").textContent =
          "$" + ship.toFixed(2);
        document.getElementById("summary-total").textContent =
          "$" + (subtotal + ship).toFixed(2);

        // Update cart count badge
        document.getElementById("cart-count").textContent = totalCount;

        // attach listeners
        itemsRoot.querySelectorAll("button[data-op]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const id = Number(btn.dataset.id);
            const op = btn.dataset.op;
            modifyCart(id, op);
          });
        });
      }

      async function modifyCart(id, op) {
        let cart = JSON.parse(localStorage.getItem("cart") || "[]");
        const item = cart.find((p) => p.id === id);
        const serverCartId = localStorage.getItem("server_cart_id");
        
        // If item has cart_item_id, it's from database - update there
        if (item && item.cart_item_id && op !== 'rm') {
          try {
            const newQty = op === 'inc' ? (item.qty || 1) + 1 : Math.max(1, (item.qty || 1) - 1);
            const response = await fetch("../../api/cart/update_item.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                cart_item_id: item.cart_item_id,
                quantity: newQty
              })
            });
            if (response.ok) {
              // Update successful, reload cart
              renderCart();
              return;
            }
          } catch (error) {
            console.warn("Failed to update server cart:", error);
          }
        } else if (item && item.cart_item_id && op === 'rm') {
          // Remove from database
          try {
            const response = await fetch("../../api/cart/remove_item.php", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                cart_item_id: item.cart_item_id
              })
            });
            if (response.ok) {
              renderCart();
              return;
            }
          } catch (error) {
            console.warn("Failed to remove from server cart:", error);
          }
        }
        
        // Fallback to localStorage for memberships or if DB update fails
        if (op === "inc") {
          if (item && item.type !== 'membership') {
            cart.push(item);
          }
        } else if (op === "dec") {
          if (item && item.type !== 'membership') {
            const idx = cart.findIndex((p) => p.id === id);
            if (idx > -1) cart.splice(idx, 1);
          }
        } else if (op === "rm") {
          cart = cart.filter((p) => p.id !== id);
        }
        localStorage.setItem("cart", JSON.stringify(cart));
        renderCart();
      }

      // listen for storage events (update when store page adds item)
      window.addEventListener("storage", (e) => {
        if (e.key === "cart") renderCart();
      });

      // initial render
      renderCart().catch(err => {
        console.error("Error rendering cart:", err);
        // Fallback to localStorage only
        const raw = localStorage.getItem("cart");
        const cart = raw ? JSON.parse(raw) : [];
        const grouped = {};
        cart.forEach((p) => {
          if (!grouped[p.id]) grouped[p.id] = Object.assign({}, p, { qty: 0 });
          grouped[p.id].qty++;
        });
        const entries = Object.values(grouped);
        const itemsRoot = document.getElementById("cart-items");
        itemsRoot.innerHTML = "";
        // ... continue with existing render logic
      });

      // Checkout functionality - global function for onclick handler
      function handleCheckoutClick(e) {
        if (e) e.preventDefault();
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        if (cart.length === 0) {
          alert("Your cart is empty!");
          return;
        }

        // Show checkout modal
        if (typeof showCheckoutModal === 'function') {
          showCheckoutModal();
        } else {
          console.error("showCheckoutModal function not found!");
          alert("Checkout system not initialized. Please refresh the page.");
        }
      }

      // Also attach event listener as backup
      function setupCheckout() {
        const checkoutBtn = document.getElementById("checkout");
        if (checkoutBtn) {
          checkoutBtn.addEventListener("click", handleCheckoutClick);
        }
      }

      // Setup checkout when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setupCheckout);
      } else {
        setTimeout(setupCheckout, 100);
      }

      function showCheckoutModal() {
        const modal = document.createElement("div");
        modal.className = "checkout-modal";
        modal.innerHTML = `
          <div class="checkout-modal-content">
            <div class="checkout-header">
              <h2>Complete Your Purchase</h2>
              <button class="close-checkout">&times;</button>
            </div>
            <div class="checkout-body">
              <div class="checkout-step active" id="step-1">
                <h3>Payment Information</h3>
                <form id="checkout-form">
                  <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" id="card-number" required>
                  </div>
                  <div class="form-row">
                    <div class="form-group">
                      <label>Expiry Date</label>
                      <input type="text" placeholder="MM/YY" maxlength="5" id="expiry" required>
                    </div>
                    <div class="form-group">
                      <label>CVV</label>
                      <input type="text" placeholder="123" maxlength="3" id="cvv" required>
                    </div>
                  </div>
                  <div class="form-group">
                    <label>Cardholder Name</label>
                    <input type="text" placeholder="John Doe" id="card-name" required>
                  </div>
                  <button type="submit" class="checkout-submit-btn">Proceed to Payment</button>
                </form>
              </div>
              <div class="checkout-step" id="step-2">
                <div class="processing">
                  <div class="spinner"></div>
                  <h3>Processing Payment...</h3>
                  <p>Please wait while we process your payment</p>
                </div>
              </div>
              <div class="checkout-step" id="step-3">
                <div class="success">
                  <svg xmlns="http://www.w3.org/2000/svg" height="80px" viewBox="0 -960 960 960" width="80px" fill="#10b981">
                    <path d="M378-246 154-470l43-43 181 181 384-384 43 43-427 427Z"/>
                  </svg>
                  <h3>Payment Successful!</h3>
                  <p>Your order has been processed successfully.</p>
                  <button class="checkout-success-btn" onclick="completePurchase()">Continue</button>
                </div>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(modal);

        // Format card number
        const cardInput = modal.querySelector("#card-number");
        cardInput.addEventListener("input", (e) => {
          let value = e.target.value.replace(/\s/g, "");
          let formatted = value.match(/.{1,4}/g)?.join(" ") || value;
          e.target.value = formatted;
        });

        // Format expiry
        const expiryInput = modal.querySelector("#expiry");
        expiryInput.addEventListener("input", (e) => {
          let value = e.target.value.replace(/\D/g, "");
          if (value.length >= 2) {
            value = value.substring(0, 2) + "/" + value.substring(2, 4);
          }
          e.target.value = value;
        });

        // CVV only numbers
        const cvvInput = modal.querySelector("#cvv");
        cvvInput.addEventListener("input", (e) => {
          e.target.value = e.target.value.replace(/\D/g, "");
        });

        // Form submission
        modal.querySelector("#checkout-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          // Move to step 2
          modal.querySelector("#step-1").classList.remove("active");
          modal.querySelector("#step-2").classList.add("active");

          // Simulate payment processing
          setTimeout(() => {
            modal.querySelector("#step-2").classList.remove("active");
            modal.querySelector("#step-3").classList.add("active");
          }, 2000);
        });

        // Close modal
        modal.querySelector(".close-checkout").addEventListener("click", () => {
          document.body.removeChild(modal);
        });

        modal.addEventListener("click", (e) => {
          if (e.target === modal) {
            document.body.removeChild(modal);
          }
        });
      }

      async function completePurchase() {
        const cart = JSON.parse(localStorage.getItem("cart") || "[]");
        if (cart.length === 0) {
          window.location.href = "../../Store/Store/Store.php";
          return;
        }

        // Separate memberships from products
        const memberships = cart.filter(item => item.type === 'membership');
        const products = cart.filter(item => item.type !== 'membership');

        try {
          // Process purchase via API
          const response = await fetch("../../api/cart/process_purchase.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: cart })
          });

          // Check if response is OK
          if (!response.ok) {
            const errorText = await response.text();
            console.error("HTTP Error:", response.status, errorText);
            alert("Server error: " + response.status + ". Please check the console for details.");
            return;
          }

          const result = await response.json();
          
          // Check if result is valid
          if (!result) {
            console.error("Invalid response from server");
            alert("Invalid response from server. Please try again.");
            return;
          }

          if (result.success) {
            // Clear cart
            localStorage.setItem("cart", "[]");
            
            // Show success message
            if (result.needs_profile_completion) {
              alert("Purchase completed successfully! Please complete your member profile to activate your membership.");
              // Redirect to profile page to complete information
              window.location.href = "../../UserProfile/userprofile.php";
            } else {
              alert("Purchase completed successfully! Your membership has been activated.");
              // Redirect to home
              window.location.href = "../../Home Full/Home.php";
            }
          } else {
            // Show detailed error message
            const errorMsg = result.error || "Failed to process purchase";
            console.error("Purchase failed:", result);
            alert("Error: " + errorMsg + (result.debug_info ? "\n\nDebug: " + JSON.stringify(result.debug_info) : ""));
          }
        } catch (error) {
          console.error("Purchase error:", error);
          alert("Network error: " + error.message);
        }
      }
    </script>

    <script>
      // Blob Mouse Interaction
      const blobs = document.querySelectorAll(".blob-dodge");

      document.addEventListener("mousemove", (e) => {
        blobs.forEach((blob) => {
          const rect = blob.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;

          const dx = cx - e.clientX;
          const dy = cy - e.clientY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          const repelRadius = 250; // distance for repulsion
          const repelPower = 3.0; // strength of repulsion
          const attractPower = 0.2; // closer follow

          // REPULSION
          if (dist < repelRadius) {
            const force = (repelRadius - dist) / repelRadius;

            blob.style.setProperty("--dx", `${dx * force * repelPower}px`);
            blob.style.setProperty("--dy", `${dy * force * repelPower}px`);
          }
          // ATTRACTION
          else {
            const ax = -dx * attractPower;
            const ay = -dy * attractPower;

            blob.style.setProperty("--dx", `${ax}px`);
            blob.style.setProperty("--dy", `${ay}px`);
          }
        });
      });
    </script>

    <script>
      // Theme Toggle
      const themeSwitch = document.getElementById("switch");
      const html = document.documentElement;

      // Load saved theme preference
      const savedTheme = localStorage.getItem("theme") || "dark";
      html.setAttribute("data-theme", savedTheme);
      if (savedTheme === "dark") themeSwitch.checked = true;

      // Toggle theme
      themeSwitch.addEventListener("change", () => {
        const newTheme = themeSwitch.checked ? "dark" : "light";
        html.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
      });

      // Navbar Sidebar Functions
      function OpenSideBar() {
        document.getElementById("navbar").classList.add("show");
        document.getElementById("overlay").classList.add("show");
      }

      function CloseSideBar() {
        document.getElementById("navbar").classList.remove("show");
        document.getElementById("overlay").classList.remove("show");
      }

      // Close sidebar when clicking on a nav link
      document.querySelectorAll("#navbar a").forEach((link) => {
        link.addEventListener("click", CloseSideBar);
      });
    </script>
  </body>
</html>
